<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jean</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; color: #111; background: #fff; height: 100vh; overflow: hidden; }
      #root { height: 100%; }
      a { color: inherit; text-decoration: none; }
      button { font: inherit; cursor: pointer; }
      input, textarea { font: inherit; }

      /* Layout */
      .app-layout { display: flex; flex-direction: column; height: 100%; }
      .chat-layout { display: flex; height: 100%; }
      .sidebar { width: 300px; border-right: 1px solid #e5e7eb; display: flex; flex-direction: column; background: #fafafa; }
      .sidebar .title { padding: 12px 16px; font-weight: 700; font-size: 16px; border-bottom: 1px solid #e5e7eb; }
      .sidebar .list { flex: 1; overflow-y: auto; padding: 8px 0; }
      .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; }
      .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6b7280; }

      /* Sidebar threads */
      .thread-row { display: flex; align-items: center; gap: 10px; padding: 8px 14px; cursor: pointer; border-bottom: 1px solid #f3f4f6; }
      .thread-row:hover { background: #f3f4f6; }
      .thread-row.selected { background: #e7f0ff; border-right: 3px solid #2563eb; }
      .thread-row .title { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
      .thread-row .meta { font-size: 11px; color: #6b7280; flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .thread-row .model { font-size: 11px; color: #6b7280; margin-left: 8px; }
      .thread-row .delete-btn { display: none; margin-left: 6px; padding: 2px 6px; font-size: 11px; color: #dc2626; border: 1px solid #dc2626; background: transparent; border-radius: 4px; }
      .thread-row:hover .delete-btn { display: inline-block; }
      .new-thread { padding: 10px 16px; border-top: 1px solid #e5e7eb; font-weight: 600; font-size: 13px; color: #2563eb; background: #fff; cursor: pointer; }
      .new-thread:hover { background: #f3f4f6; }

      /* Thread view */
      .thread-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; border-bottom: 1px solid #e5e7eb; }
      .thread-header .title { font-weight: 700; font-size: 16px; }
      .thread-header .model-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #eef2ff; color: #2563eb; border: 1px solid #c7d2fe; }
      .thread-header .model-badge.none { background: #f3f4f6; color: #6b7280; border-color: #e5e7eb; }
      .actions { display: flex; gap: 6px; }
      .icon-btn { padding: 4px 8px; font-size: 11px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; }
      .icon-btn:hover { background: #f3f4f6; }
      .icon-btn.danger { color: #dc2626; border-color: #fca5a5; }
      .icon-btn.danger:hover { background: #fdecec; }

      /* Messages */
      .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
      .message { max-width: 70%; padding: 8px 12px; border-radius: 10px; line-height: 1.45; font-size: 14px; white-space: pre-wrap; }
      .message.user { align-self: flex-end; background: #e7f0ff; color: #111; border-bottom-right-radius: 2px; }
      .message.assistant { align-self: flex-start; background: #f3f4f6; color: #111; border-bottom-left-radius: 2px; }
      .message .meta { font-size: 11px; color: #6b7280; margin-top: 4px; display: block; }

      /* Composer */
      .composer { border-top: 1px solid #e5e7eb; padding: 10px 16px; background: #fff; }
      .composer-row { display: flex; gap: 8px; align-items: flex-end; }
      .composer textarea { flex: 1; min-height: 36px; max-height: 120px; resize: vertical; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 10px; outline: none; font-size: 14px; }
      .composer textarea:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; }
      .composer .send { padding: 8px 14px; font-weight: 600; background: #2563eb; color: #fff; border: none; border-radius: 8px; white-space: nowrap; }
      .composer .send:disabled { background: #9ca3af; cursor: not-allowed; }
      .composer .pick { padding: 8px 12px; font-size: 12px; border: 1px solid #d1d5db; background: #fff; border-radius: 8px; white-space: nowrap; }
      .composer .pick:disabled { background: #f3f4f6; color: #9ca3af; cursor: not-allowed; border-color: #e5e7eb; }

      /* Picker prompt */
      .prompt { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #6b7280; gap: 10px; padding: 24px; text-align: center; }
      .prompt .prompt-title { font-weight: 700; font-size: 15px; color: #111; }
      .prompt .choose-btn { padding: 8px 14px; font-weight: 600; background: #2563eb; color: #fff; border: none; border-radius: 8px; }
      .prompt .choose-btn:hover { background: #1d4ed8; }
      .prompt .choose-btn:disabled { background: #9ca3af; cursor: not-allowed; }

      /* Model picker dropdown */
      .picker { position: absolute; z-index: 50; border: 1px solid #d1d5db; background: #fff; border-radius: 8px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); padding: 8px 0; min-width: 220px; }
      .picker-group-title { font-size: 11px; font-weight: 700; color: #6b7280; padding: 6px 12px; text-transform: uppercase; letter-spacing: 0.05em; }
      .picker-item { display: block; width: 100%; text-align: left; padding: 7px 12px; font-size: 13px; border: none; background: transparent; cursor: pointer; }
      .picker-item:hover { background: #f3f4f6; }
      .picker-item.selected { background: #e7f0ff; font-weight: 600; color: #2563eb; }
      .hr { border: none; border-top: 1px solid #e5e7eb; margin: 0; }

      /* Pages */
      .page { padding: 24px; max-width: 560px; }
      .page h1 { font-size: 26px; margin: 0 0 8px; }
      .form { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label { font-size: 13px; font-weight: 600; }
      .field input { padding: 8px 10px; border: 1px solid #d1d5db; border-radius: 8px; outline: none; font-size: 14px; }
      .field input:disabled { background: #f3f4f6; }
      .field .error { color: #dc2626; font-size: 12px; margin-top: 4px; }
      .btn { padding: 8px 14px; font-weight: 600; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; cursor: pointer; font-size: 14px; }
      .btn.primary { background: #2563eb; color: #fff; border-color: #2563eb; }
      .btn.primary:hover { background: #1d4ed8; }
      .btn:disabled { opacity: 0.6; cursor: not-allowed; }
      .muted { color: #6b7280; font-size: 13px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
