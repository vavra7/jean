services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jean
      POSTGRES_PASSWORD: jean
      POSTGRES_DB: jean
    ports:
      - "5432:5432"
    volumes:
      - jean_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jean -d jean"]
      interval: 5s
      timeout: 2s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://jean:jean@postgres:5432/jean
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => { if (!r.ok) process.exit(1) })"]
      interval: 5s
      timeout: 2s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  jean_postgres_data:
